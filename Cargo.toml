[workspace]
resolver = "2"
members = [
    "crates/*",
    "apps/*",
    
]

[workspace.dependencies]
petgraph = "0.8.3"
geo = "0.33.1"
ordered-float = "5.5.0"

csv = "1.4.0"
osmpbf = "0.3.8"

eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", features = ["serde"] }

rayon = "1.10" 
thiserror = "2.0.21"
rand = "0.10.3"
ahash = "0.8.11"
log = "0.4.34"

ort = { version = "=2.0.0-rc.15", features = ["ndarray"] }
ndarray = "0.17.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
imageproc = { version = "0.27.0", features = ["text"] }
ab_glyph = "0.2.32"