[workspace]
resolver = "2"
members = [
    "crates/*",
    "apps/*",
    
]

[workspace.dependencies]
# Performance Graph & Math
petgraph = "0.8.3"
geo = "0.33.1"
ordered-float = "5.5.0"

# Data reader
csv = "1.4.0"
osmpbf = "0.3.8"

# Data parallelism 
rayon = "1.10" 

# GUI
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

# Serialization & Datetime
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", features = ["serde"] }

# Utility
thiserror = "2.0.21"
rand = "0.10.3"
ahash = "0.8.11"
log = "0.4.34"