[package]
name = "vehicle-pipeline"
version = "0.1.0"
edition = "2021"

[features]
default = ["std", "annotate"]
std = [
    "vehicle-detector/std",
    "vehicle-tracker/std",
    "vehicle-quality/std",
    "vehicle-lpr/std",
    "vehicle-lpocr/std",
]
annotate = ["dep:imageproc", "dep:ab_glyph"]

[dependencies]
vehicle-detector = { path = "../vehicle-detector" }
vehicle-tracker = { path = "../vehicle-tracker" }
vehicle-quality = { path = "../vehicle-quality" }
vehicle-lpr = { path = "../vehicle-lpr" }
vehicle-lpocr = { path = "../vehicle-lpocr" }
heapless = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }

# Debug visualizer only
imageproc = { workspace = true, optional = true }
ab_glyph = { workspace = true, optional = true }

[dev-dependencies]
imageproc = { workspace = true }
ab_glyph = { workspace = true }
libc = { workspace = true }