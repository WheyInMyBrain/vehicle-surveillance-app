[package]
name = "vehicle-quality"
version = "0.1.0"
edition = "2021"

[features]
default = ["std"]
std = ["vehicle-detector/std", "vehicle-tracker/std", "image"]

[dependencies]
vehicle-detector = { path = "../vehicle-detector" }
vehicle-tracker = { path = "../vehicle-tracker" }
heapless = { workspace = true }
thiserror = { workspace = true }
image = { workspace = true, optional = true }

[dev-dependencies]
imageproc = { workspace = true }
ab_glyph = { workspace = true }